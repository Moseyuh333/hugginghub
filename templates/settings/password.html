{% extends "settings/base.html" %}
{% block settings %}
<h2>Password</h2>
{% if flash %}<div class="alert ok">{{ flash }}</div>{% endif %}
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form class="panel" method="post" action="/settings/password">
  <label class="field"><span>Current password</span><input class="input" type="password" name="current" required></label>
  <label class="field"><span>New password</span><input class="input" type="password" name="password" required minlength="8"></label>
  <button class="btn dark" type="submit">Change password</button>
</form>
{% endblock %}
